[project]
name = "databricks_linkedin_analytics"
version = "0.1.0"
authors = [{ name = "Yingzhao Ouyang" }]
description = "Databricks Asset Bundle for LinkedIn analytics pipelines"
requires-python = ">=3.10,<=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pytest>=9.0.2",
]

[dependency-groups]
dev = [
    "pytest",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_analytics_jobs", "src/excel_ingestion_app"]

[tool.black]
line-length = 125
